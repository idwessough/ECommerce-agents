[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-analysis-agent"
version = "0.1.0"
description = "Containerized Google ADK market analysis agent scaffold."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-adk==1.27.2",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "agents"}

[tool.setuptools.packages.find]
where = ["agents"]

[tool.setuptools.package-data]
ecommerce_agents = ["data/*.json"]
